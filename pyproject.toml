[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vpd"
version = "0.1.0"
description = "Voice pathology detection with hand-implemented classical speech features and neural models (CS 568 term project)"
requires-python = ">=3.10"
authors = [{ name = "Mustafa Mert Süerkan" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
